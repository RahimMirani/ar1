[project]
name = "firedrone"
version = "0.1.0"
description = "Autonomous fire-response drone agent built on NimbusOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- firedrone (BetaFPV + NimbusOS) — code under firedrone/ ---
    "nimbusos-sdk>=0.1.4",
    "pynput>=1.8.2",
    "rich>=15.0.0",
    # --- tello (DJI Tello dashboard) — code under tello/ ---
    "djitellopy>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "opencv-python>=4.10.0",
]

[project.scripts]
firedrone-teleop = "firedrone.teleop:main"
firedrone-telemetry = "firedrone.scripts.print_telemetry:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
